[project]
name = "cidaren"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "certifi>=2024.8.30",
    "flask>=3.1,<4",
    "mitmproxy==11.0.2",
    "requests>=2.32,<3",
]

[project.optional-dependencies]
test = [
    "pytest>=8.3,<10",
    "pytest-cov>=5,<8",
]

[project.scripts]
cidaren = "cidaren.web:main"

[tool.pytest.ini_options]
addopts = "--basetemp=.pytest-tmp"
testpaths = ["cidaren/test_config.py", "tests"]
